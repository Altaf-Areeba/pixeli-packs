# When images are uploaded into inbox/, turn them into color-by-number pictures,
# add them to this month's pack and remove the originals. The app picks them up within 6 hours.
name: Add pictures
on:
  push:
    paths: ['inbox/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tools/add-pictures.js .
      - run: |
          git config user.name "pixeli-bot"
          git config user.email "pixeli-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add pictures from inbox" && git push)
